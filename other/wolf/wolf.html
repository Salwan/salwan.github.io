<!--Force IE6 into quirks mode with this comment tag-->
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en" xml:lang="en">
	<head>
		<meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1" />
		<title>Wolf Prototype</title>
		<style type="text/css" media="screen">

		body
		{
			margin: 0;
			padding: 0;
			border: 0;
			overflow: hidden;
			height: 100%; 
			max-height: 100%; 
		}

		#framecontent
		{
			position: absolute; 
			bottom: 0; 
			left: 0; 
			width: 100%; 
			height: 50px; /*Height of frame div*/
			overflow: hidden; /*Disable scrollbars. Set to "scroll" to enable*/
			background: black;
			color: white;
		}

		#maincontent
		{
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			bottom: 50px; /*Set bottom value to HeightOfFrameDiv*/
			overflow: auto; 
			background: #000;
			color: #fff;
		}

		.innertube
		{
			margin: 15px; /*Margins for inner DIV inside each DIV (to provide padding)*/
		}
		
		#horizon
		{
			color: white;
			background-color: #000;
			text-align: center;
			position: absolute;
			top: 50%;
			left: 0px;
			width: 100%;
			height: 1px;
			overflow: visible;
			visibility: visible;
			display: block;
		}
		
		#wolfclip
		{
			font-family: Verdana, Geneva, Arial, sans-serif;
			background-color: #000;
			margin-left: -400px;
			position: absolute;
			top: -300px;
			left: 50%;
			width: 800;
			height: 500px;
			visibility: visible;
		}
		
		#appengine
		{
			text-align: center;
		}

		* html body
		{ /*IE6 hack*/
			padding: 0 0 130px 0; /*Set value to (0 0 HeightOfFrameDiv 0)*/
		}

		* html #maincontent
		{ /*IE6 hack*/
			height: 100%; 
			width: 100%; 
		}
		</style>
		<script type="text/javascript">
			/*** Temporary text filler function. Remove when deploying template. ***/
			var gibberish=["This is just some filler text", "Welcome to Dynamic Drive CSS Library", "Demo content nothing to read here"]
			function filltext(words)
			{
				for (var i=0; i<words; i++)
					document.write(gibberish[Math.floor(Math.random()*3)]+" ")
			}
		</script>
		<!-- Ruffle player -->
		<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
	</head>
	<body>
		<div id="framecontent">
			<div class="innertube">
			</div>
		</div>
		<div id="maincontent">
			<div class="innertube">
				<div id="horizon">
					<div id="wolfclip">
						<!-- Set by script below -->
					</div>
				</div>
			</div>
		</div>
	</body>
	<script>
		window.RufflePlayer = window.RufflePlayer || {};
		window.addEventListener("load", (event) => {
			const ruffle = window.RufflePlayer.newest();
			let player = ruffle.createPlayer();
			player.style.width = "800px";
			player.style.height = "500px";
			player.backgroundColor = "#000000";
			const container = document.getElementById("wolfclip");
			container.appendChild(player);
			player.load("wolf.swf");
		});
	</script>
</html>
